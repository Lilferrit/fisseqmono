# params.yaml -- every default pipeline parameter, nothing else. Load
# explicitly:
#
#   nextflow run . -params-file params.yaml --pipeline_dir /path/to/run \
#       --cell_dino_checkpoint /path/to/checkpoint.pth
#
# Per-run overrides: `--key value` on the command line wins over this file.
# Executor/container settings live in nextflow.config and your own site
# config (`-c site.config`; see docs/embeddings-pipeline/nextflow.md) -- never default parameter
# values.

# ── Required, no default (fail fast if unset) ──────────────────────────────
pipeline_dir: null
container_image: "fisseq-embeddings-pipeline:latest"
cell_dino_checkpoint: null
experiments: []

# ── Per-experiment configs (BUILD_CELL_IMAGES / BUILD_CELL_METADATA / BUILD_CP_FEATURES) ──
# Each experiment map in `experiments:` below supplies fields for up to
# three stages:
#
# - BUILD_CELL_IMAGES (starcall-workflow-facing, always runs):
#   starcall_workflow_dir, phenotyping_dir, segmentation_dir,
#   sequencing_dir, wells, grid_size, segmentation_type, use_corrected,
#   window, shard_size, sequencing_reads_params, and the reads tables'
#   genotype column names barcode_col_name/aa_changes_col_name/
#   edit_distance_col_name (default upBarcode/aaChanges/editDistance),
#   which it renames to meta_barcode/meta_aa_changes/meta_edit_distance in
#   both cell_table.parquet and every shard's meta.json. Changing one
#   doesn't recut shards that already exist (snakemake reruns on mtime,
#   not params). This is the ONLY stage that touches
#   starcall-workflow's tree or invokes Snakemake -- see
#   docs/embeddings-pipeline/architecture.md's Data contracts section. `starcall_workflow_dir`
#   is per-experiment (not a shared global path) since Snakemake keeps
#   invocation-scoped lock/log state in its own working directory --
#   nothing requires it to be named "starcall-workflow" or nested under a
#   separate per-experiment folder of its own: it can just BE your
#   experiment's root directory (e.g. `starcall_workflow_dir:
#   /data/experiment1`, not `/data/experiment1/starcall-workflow`) --
#   `phenotyping_dir`/`segmentation_dir`/`sequencing_dir` default under
#   whatever you point it at. It supplies only that experiment's
#   config.yaml and data trees, not starcall's code: the nested run
#   executes snakemake/Snakefile, which includes the starcall-workflow
#   commit the image is built at (docs/embeddings-pipeline/architecture.md decision 24), so
#   no starcall checkout needs to live in it.
#   `phenotyping_dir`/`segmentation_dir`/`sequencing_dir` are all OPTIONAL
#   -- each is auto-resolved when omitted: if `starcall_workflow_dir` has
#   its own `config.yaml` (or `default-config.yaml`), that project's own
#   value for the key is used (reading the actual config that governs
#   where Snakemake writes/reads these trees -- correct even if a project
#   remaps them to nonstandard names); otherwise it falls back to a
#   subdirectory of `starcall_workflow_dir` (`phenotyping`/`segmentation`/
#   `sequencing`), matching starcall-workflow's own documented default.
#   Set one explicitly only when that tree isn't colocated under
#   `starcall_workflow_dir` at all for your lab (e.g. `sequencing_dir` on
#   separate storage) -- an explicit value always wins over both. See
#   docs/embeddings-pipeline/architecture.md and the example below.
# - CellMetadataConfig (BUILD_CELL_METADATA) and CpFeaturesConfig
#   (BUILD_CP_FEATURES, only for `cp_features: true` entries): no
#   per-experiment fields of their own besides batch_stem. Their input is
#   injected automatically from BUILD_CELL_IMAGES' own output -- never set
#   it yourself.
#
# `batch_stem` is required on every map (there's no filename to derive it
# from), must be unique across the list, and any field a map omits falls
# back to the matching global default in "Shared per-experiment defaults"
# below (`window`, `cellprofiler_pipeline`, `cellprofiler_cycle`), or
# failing that, the relevant stage's own Hydra default (or raises an error
# if that field has none, e.g. starcall_workflow_dir).
#
# `wells` and `grid_size` are optional -- when omitted, they're
# starcall-workflow's own: the project config's `wells` (or the wells it
# detects from its input tree) and its `phenotyping_grid_size`. Every tile
# of the grid is requested from starcall, whether or not it exists yet.
#
# `sequencing_reads_params` (default "") is the `{params}` wildcard
# component of starcall-workflow's `{segmentation_type}_reads{params}.csv`
# output filename -- almost always empty; set it explicitly only if your
# starcall-workflow config uses a non-empty value there (verify against a
# real run -- see docs/embeddings-pipeline/architecture.md's flagged risks).
#
# Set `cp_features: true` on an entry to also run that experiment through
# the CellProfiler-feature track (see docs/embeddings-pipeline/architecture.md):
# BUILD_CP_FEATURES onward, and BUILD_CELL_IMAGES additionally forces +
# folds in that experiment's CellProfiler CSV. `cellprofiler_pipeline`/
# `cellprofiler_cycle` can be set directly on a `cp_features: true` entry
# to override this experiment's CellProfiler filename components, falling
# back to the global defaults below when omitted. Omit `cp_features` (or
# leave it `false`) for a cellDINO-only experiment -- the default, so
# existing runs work unchanged.
#
# The empty list below is deliberate -- every real run supplies its own
# `experiments:` list by editing this file (or a full copy of it, passed as
# a different --configfile; there's no "just point at a directory of
# per-experiment files" shortcut).
#
# experiments:
#   - batch_stem: experiment1
#     starcall_workflow_dir: /data/experiment1   # IS this experiment's root -- no separate folder needed
#     # phenotyping_dir/segmentation_dir/sequencing_dir omitted -- default
#     # to /data/experiment1/{phenotyping,segmentation,sequencing}
#     wells: [well1, well2]        # grid_size omitted -- the project config's phenotyping_grid_size
#     # window omitted -- falls back to the global `window` default below
#     cp_features: true            # also run the CellProfiler-feature track for this experiment
#     # cellprofiler_pipeline/cellprofiler_cycle omitted -- fall back to
#     # the global defaults below
#   - batch_stem: experiment2
#     starcall_workflow_dir: /data/experiment2
#     # sequencing data lives on separate storage for this experiment --
#     # phenotyping_dir/segmentation_dir still default under
#     # starcall_workflow_dir, only sequencing_dir is overridden
#     sequencing_dir: /mnt/sequencer-storage/experiment2/sequencing
#     wells: [well3]
#     grid_size: 8                 # explicit override
#     window: 180                  # per-experiment override of the global default
#     # cp_features omitted -- cellDINO-only for this experiment

# ── Shared per-experiment defaults (window / shard_size / cellprofiler_pipeline / cellprofiler_cycle) ──
# `window` (BUILD_CELL_IMAGES: the crop size each tile's shard is cut at),
# `shard_size` (BUILD_CELL_IMAGES: cells per WebDataset shard) and
# `cellprofiler_pipeline`/`cellprofiler_cycle` (CpFeaturesConfig-facing,
# consumed by BUILD_CELL_IMAGES) are logically per-experiment fields (see
# "Per-experiment configs" above), but in practice are almost always the
# same value across every experiment in a run -- one crop size per
# Cell-DINO checkpoint, one CellProfiler pipeline per run. Set the shared
# value once here; `config/experiments.py` fills it in for any `experiments:` entry
# that doesn't set its own value for that key, and an entry that *does* set
# its own value always wins over the global default here.
window: 224                    # crop size in pixels -- must match cell_dino_crop_size below
shard_size: null               # cells per WebDataset shard, counted per well (well_{n}_shard_{k}.tar.gz); null = one shard per well
cellprofiler_pipeline: null    # the CellProfiler .cppipe pipeline's basename -- required (here, or per `cp_features: true` entry) once any experiment sets cp_features: true
cellprofiler_cycle: ""         # "" (no cycle) unless starcall-workflow ran cellprofiler per-cycle


# ── Nested starcall run (BUILD_CELL_IMAGES) ──────────────────────────────────
# BUILD_CELL_IMAGES runs starcall-workflow's own Snakefile as a nested
# snakemake (7.32, in the image's ops env). By default every starcall rule
# runs inside that one task:
snakemake_cores: 4             # the nested run's --cores in local mode (no starcall_profile)
starcall_retries: null         # the nested run's --retries: rerun a failed starcall job this many more times,
                               # each attempt with double the last mem_mb; null = the profile's `retries:`, else none
#
# To fan starcall's rules out across your cluster instead, point
# starcall_profile at a snakemake 7 profile directory saying how to submit
# jobs (`cluster:`, `cluster-cancel:`, `jobs:`, resources...). It lives
# outside this repo -- nothing scheduler-specific does. Each submitted job
# lands on a bare node but has to run inside the pipeline image (starcall's
# rule bodies execute in the ops env's interpreter), so BUILD_CELL_IMAGES
# also passes a --jobscript that re-enters starcall_job_image there. See
# docs/embeddings-pipeline/nextflow.md.
starcall_profile: null         # path to a snakemake 7 profile dir; null = local mode
starcall_job_image: null       # a .sif of container_image on storage every node can read -- required with starcall_profile
starcall_container_bin: apptainer  # what a child job re-enters the image with; some nodes only ship `singularity`
# Extra host paths every child job binds, on top of the ones BUILD_CELL_IMAGES
# derives (the data dirs, starcall_workflow_dir, the snakemake cache, each
# also at its symlink-resolved path). Use it for data a starcall config
# reaches through a symlink elsewhere, e.g. the same broad shared-storage
# root your site config binds for the outer tasks.
starcall_job_binds: []
#
# Where BUILD_CELL_IMAGES points $XDG_CACHE_HOME (and $HOME) for the nested
# run. Snakemake mkdir's $XDG_CACHE_HOME/snakemake while constructing its
# Workflow object -- before any rule runs, with no flag to move it -- and
# under Apptainer $HOME is often a read-only cluster home ("OSError: [Errno
# 30] Read-only file system"). null resolves to
# <pipeline_dir>/.snakemake_cache, which is writable and persists across
# runs. It's bind-mounted into BUILD_CELL_IMAGES' container automatically.
snakemake_cache_dir: null
# Request a GPU for the nested starcall run -- its segmentation rules run
# stardist/cellpose/tensorflow out of the ops env. Adds --nv/--gpus to
# BUILD_CELL_IMAGES' container, and --nv to every child job in cluster
# mode. Apptainer only warns on a GPU-less node; Docker's --gpus fails
# outright there, so set this false on a GPU-less Docker host.
starcall_gpu: true

# ── Stopping early ───────────────────────────────────────────────────────────
# true = stop after EMBED_CELLS: no QC-dependent cellDINO stages, no
# reproducibility filtering, no CellProfiler track.
embeddings_only: false

# ── Reproducibility ──────────────────────────────────────────────────────────
random_seed: 0

# ── QC filtering (QC_FILTER) ─────────────────────────────────────────────────
# The same QC as fisseq-data-pipeline's. The input column names are
# BUILD_CELL_METADATA's fixed meta_barcode / meta_aa_changes / meta_edit_distance
# (set in conf/modules.config, not here).
barcode_count_threshold: 10
variant_barcode_count_threshold: 4
edit_distance_threshold: 1
# Optional int: restrict qc_variant_downsample_classes to at most this many
# distinct variants (see qc_variant_downsample_mode), applied before QC
# thresholding; null = disabled.
qc_n_variants: null
# classify_variant() categories eligible for the qc_n_variants restriction.
qc_variant_downsample_classes: ["Single Missense"]
# "top" (highest cell count) or "random" (seeded by random_seed).
qc_variant_downsample_mode: "top"
# Optional single float (0,1] / int, or a list of floats/ints: pseudo-variant
# downsampling per label_column group, drawn from post-QC cells. A float keeps
# that fraction of a group; an int keeps that many rows and skips any group
# with fewer. Each amount gets its own `:downsample-{amount}` tag on
# meta_aa_changes, with the base label preserved and the tag exposed separately
# as meta_variant_tag. null = disabled.
qc_downsample_amounts: null
# classify_variant() categories eligible for pseudo-variant generation.
qc_downsample_classes: ["Synonymous", "Single Missense"]

# ── Cell Embeddings / Cell-DINO (EMBED_CELLS) ────────────────────────────────
# Defaults here match weights/channel_adaptive_dino_vitl16_pretrain_cells-
# ef7c17ff.pth's real, verified architecture (bag-of-channels vit_large/
# patch16/224 -- see docs/embeddings-pipeline/architecture.md's "Real checkpoint" section).
# cell_dino_checkpoint itself is deliberately left unset above (required,
# no default) since a checkpoint path is deployment-specific and weights/
# is gitignored.
cell_dino_arch: "vit_large"
cell_dino_patch_size: 16
cell_dino_crop_size: 224        # must match the per-experiment `window` the shards are cut at
cell_dino_channels: [0, 1, 2, 3]                          # which crop channel indices to embed, in order
cell_dino_apply_mask: true    # apply the shared per-cell mask to EVERY selected channel (one mask per cell, no channel axis)
cell_dino_channel_pool: "mean"  # mean | max | cls_concat
cell_dino_device: "cuda"
cell_dino_batch_size: 256
cell_dino_num_workers: 4

# ── Label column, shared pipeline-wide ──────────────────────────────────────
# Read by QC_FILTER, NORMALIZE, OVWT_BATCHWISE, the feature-selection chain and
# their CellProfiler-feature-track counterparts -- one override changes the
# variant label column everywhere at once.
filter_label_column: "meta_aa_changes"

# ── Run gates (after EMBED_CELLS) ───────────────────────────────────────────
run_ovwt: true               # OVWT_BATCHWISE (both tracks)
run_feature_selection: true  # the batchwise feature-selection chain (cellDINO track)

# ── Feature selection (bootstrap + aggregation + correlation) ───────────────
# All aggregators that make sense as a reproducibility statistic. Their
# published per-variant aggregates (feature_select_batchwise/<batch>/aggregates/)
# are z-scored against the experiment's synonymous variants, so every
# experiment needs at least two synonymous variants.
feature_select_types: ["mean", "median", "MAD", "std", "KS", "QQ", "AUROC"]
# Aggregates that are computed and joined onto the final per-variant table but
# kept out of feature selection entirely: no bootstrap halves, no correlation
# blocklist, and no synonymous-baseline normalization. Intended for the p-value
# statistics (KSnegLogP, AUROCnegLogP), which are wanted in the output but are
# not reproducibility statistics. Must not overlap
# feature_select_types; [] = none.
feature_select_passthrough_types: []
feature_select_bootstrap_reps: 10
# Optional float (0,1) or int; null = no wildtype downsampling in
# AGGREGATE_HALF / AGGREGATE_FEATURE_TYPE.
feature_select_downsample_wt: null
feature_select_min_correlation: 0.5
# Number of feature columns AGGREGATE_FEATURE_TYPE / AGGREGATE_HALF evaluate
# per Polars query. Aggregating all ~1731 features in one query is what
# OOM-killed (exit 137) every KS/AUROC/QQ task on the 111925 run; chunking caps
# peak memory at roughly chunk_size x n_variant_labels (x the control pool, for
# the reference-based aggregators KS/signedKS/QQ/AUROC and the two p-value
# variants).
#
# THIS VALUE IS SIZED TO THE MEMORY ONE TASK IS GRANTED. Measured at production
# shape (500k cells x 1731 features x 1900 variants, ~25k control cells):
# mean/median/std/MAD cost ~1.5 GB at ANY chunk size in this range and are not
# the constraint. The reference-based aggregators cost roughly 3 GB (AUROC) to
# 4.5 GB (KS, the worst) PER FEATURE IN THE CHUNK -- AUROC measured 3.3 GB at
# chunk 1 and was killed above 5.6 GB at chunk 4. So:
#
#     chunk_size ~= (memory_per_task_GB - 1) / 4.5
#
#   16 GB/task -> 4      64 GB/task -> 14
#   32 GB/task -> 8     128 GB/task -> 32   <- the default below
#
# Those per-feature costs scale with n_variant_labels x control_pool_size, so a
# batch with twice the labels or twice the WT pool wants half the chunk. If
# KS/AUROC/QQ tasks still come back killed, halve this first.
#
# Raising it only speeds things up until memory runs out: runtime per task is
# dominated by the number of chunks, so 1731 features at chunk 32 is 55 queries
# where chunk 1 is 1731 (AUROC took ~17 min at chunk 1 at the shape above). A
# run using only mean/median/std/MAD can raise this to 128-256 freely.
#
# null disables chunking entirely -- every feature in one query, which is the
# pre-chunking behaviour and therefore the shape that OOM-killed the 111925
# run. It is an escape hatch for small inputs (or for reproducing the old
# numbers), not a setting for a full-size batch.
#
# NOTE: every AGGREGATE_* process declares `label 'process_medium'`, which
# nextflow.config deliberately leaves unsized -- this default assumes a site
# config granting these tasks >=128 GB (e.g. a
# `withLabel:process_medium { memory = '128 GB' }` selector in your -c file).
aggregate_feature_chunk_size: 32

# ── Aggregation (CellProfiler-feature track) ────────────────────────────────
# The CellProfiler track is aggregated (AGGREGATE_FEATURE_TYPE_CP_FEATURES, the
# same stage as AGGREGATE_FEATURE_TYPE_BATCHWISE: z-scored against the
# synonymous variants) and scored by OvWT, but not reproducibility-filtered.
feature_select_types_cp_features: ["median"]

# ── OVWT Distinguish-ability Scores (OVWT_BATCHWISE) ─────────────────────────
# Also reused, unchanged, by OVWT_BATCHWISE_CP_FEATURES -- these are
# scoring-methodology hyperparameters, not tied to feature type, so there
# is no parallel "_cp_features" set for them.
ovwt_wt_label: "WT"
# Fold scheme, "kfold" or "barcode_holdout".
#   kfold           -- ovwt_n_folds folds, stratified jointly on
#                      (meta_barcode, is_wt); every fold's model has seen every
#                      barcode.
#   barcode_holdout -- whole barcodes are held out of training a fold at a
#                      time, so no model is ever trained on a barcode it later
#                      scores and the AUROCs measure generalization to an
#                      unseen barcode. Wildtype cells are still split across
#                      the folds. A variant with only one barcode is skipped
#                      (nothing left to train on).
ovwt_cv_mode: "kfold"
# Folds per variant. Under "kfold" this is the fold count outright. Under
# "barcode_holdout" it caps the folds: the variant's barcodes are packed into
# at most this many cell-count-balanced groups, one group held out per fold, so
# a variant with fewer barcodes than this simply gets one fold per barcode.
# null = one fold per barcode always (pure leave-one-barcode-out); it is an
# error under "kfold", which has no barcode count to fall back on. Must be >= 2.
ovwt_n_folds: 5
ovwt_calibrate: true
ovwt_min_cells: 250
ovwt_downsample_wt: true

# ── Cross-experiment aggregation ────────────────────────────────────────────
# Not done here: every output is per experiment. `fisseqborn-global
# <pipeline_dir> --out <dir>` (the fisseqborn package) votes the blocklists
# across experiments (--min-batches), pools each variant's median and runs the
# PCA (--cumulative-variance-explained), for both tracks. The former
# reproducibility_global_min_batches_ok and global_variant_*_cumulative_variance_explained
# params are ignored, with a warning.
