[project]
name = "fisseq-data-pipeline"
version = "2.0.0"
description = "Nextflow + Python pipeline for single-cell CellProfiler morphological profiling of FISSEQ variant data"
readme = "README.md"
authors = [
    { email = "gwenneth.straub@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fisseq-common[stages] @ git+https://github.com/Lilferrit/fisseqmono@v2.0.0#subdirectory=packages/fisseq-common",
    "hydra-core>=1.3.2",
    "joblib>=1.5.1",
    "polars>=1.32.3",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "tqdm>=4.67.3",
    "xgboost>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
# importlib mode: test modules with the same basename in different packages don't collide.
addopts = ["--import-mode=importlib"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.16.0",
    "pre-commit>=4.5.1",
    "pytest>=8.4.1",
    "ruff>=0.15.12",
]

[tool.uv.sources]
fisseq-common = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true
