site_name: fisseqborn
site_description: Seaborn-style, object-oriented plots of polars DataFrames for the fisseq project
repo_name: fisseqborn

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - User guide:
      - Concepts: concepts.md
      - The fisseq theme: theme.md
      - Loading pipeline outputs: data.md
  - Plots:
      - Boxplots: plots/box.md
      - Embeddings (UMAP / PCA): plots/embedding.md
      - Correlation scatter: plots/correlation.md
      - ROC curves: plots/roc.md
      - Heatmaps: plots/heatmap.md
      - Clustermaps: plots/clustermap.md
      - Explained variance: plots/explained-variance.md
      - Pair plots: plots/pairplot.md
      - Volcano plots: plots/volcano.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
