[project]
name = "fisseq-common"
version = "2.0.0"
description = "Shared schema, output layout, variant classification and stage logic for the FISSEQ pipelines and fisseqborn"
readme = "README.md"
authors = [
    { name = "Gwen Straub", email = "gwenneth.straub@gmail.com" }
]
requires-python = ">=3.13,<3.14"
# Base install stays light: fisseqborn depends on it without the heavy stage dependencies.
dependencies = [
    "numpy",
    "polars>=1.32.3",
    "pyarrow>=21.0.0",
]

[project.optional-dependencies]
# Everything the per-experiment pipeline stages need (fisseq_common.stages).
stages = [
    "hydra-core>=1.3.2",
    "joblib>=1.5.1",
    "pycytominer>=1.4.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "tqdm>=4.67.3",
    "xgboost>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = ["fisseq-common[stages]", "pytest>=8.4.1"]
