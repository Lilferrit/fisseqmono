# fisseq-element-data-pipeline's image (_docker.yml). This pipeline lives on the
# element-pipeline branch, which is not merged into main, so the image is built on every push
# to that branch (and to main and v* tags), with no paths filter: every commit on the branch
# gets its own :<short-sha> image, the tag scratch/fowler-sge's run.sh pulls. :latest is the
# most recent of those builds. Pull requests build no image.
name: docker fisseq-element-data-pipeline

on:
  push:
    branches: [main, element-pipeline]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/_docker.yml
    with:
      pipeline: fisseq-element-data-pipeline
    permissions:
      contents: read
      packages: write
