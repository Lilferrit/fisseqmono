# fisseq-embeddings-pipeline's own test suite, on changes to it or to what it depends on.
name: fisseq-embeddings-pipeline

on:
  pull_request:
    paths: &paths
      - packages/fisseq-embeddings-pipeline/**
      - packages/fisseq-common/**
      - nextflow/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/_package.yml
      - .github/workflows/pkg-fisseq-embeddings-pipeline.yml
  push:
    branches: [main]
    paths: *paths

jobs:
  tests:
    uses: ./.github/workflows/_package.yml
    with:
      package: fisseq-embeddings-pipeline
      integration: true
