# fisseqborn's own test suite, on changes to it or to what it depends on.
name: fisseqborn

on:
  pull_request:
    paths: &paths
      - packages/fisseqborn/**
      - packages/fisseq-common/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/_package.yml
      - .github/workflows/pkg-fisseqborn.yml
  push:
    branches: [main]
    paths: *paths

jobs:
  tests:
    uses: ./.github/workflows/_package.yml
    with:
      package: fisseqborn
      integration: false
