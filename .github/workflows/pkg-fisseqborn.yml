# fisseqborn's unit tests, on pull requests that change it or what it depends on.
name: fisseqborn

on:
  pull_request:
    paths:
      - packages/fisseqborn/**
      - packages/fisseq-common/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/_package.yml
      - .github/workflows/pkg-fisseqborn.yml
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/_package.yml
    with:
      package: fisseqborn
      integration: false
