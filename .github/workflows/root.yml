# On every change: lint, the lockfile, Nextflow lint, and the cross-package tests (tests/:
# reference outputs, the layout and global-aggregation parity checks, the release script),
# which install all four packages through the root dev group.
name: workspace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: uv.lock is up to date
        run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  nextflow-lint:
    name: Nextflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"
      - run: >-
          nextflow lint nextflow
          packages/fisseq-data-pipeline/workflows packages/fisseq-data-pipeline/modules
          packages/fisseq-data-pipeline/conf
          packages/fisseq-embeddings-pipeline/workflows packages/fisseq-embeddings-pipeline/modules
          packages/fisseq-embeddings-pipeline/conf

  tests:
    name: Cross-package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"
      - run: uv sync --frozen
      - run: uv run pytest tests
