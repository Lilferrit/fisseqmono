# Build one pipeline's image from the workspace root (it needs fisseq-common and uv.lock), and
# push it from main and v* tags. Called by docker-<pipeline>.yml, whose `paths` filter lists
# exactly the files that image is built from.
#
#   - Registry: ghcr.io/<owner>/<pipeline>, the names params.yaml's container_image uses.
#     The packages must grant this repository write access (package settings → Manage
#     Actions access) if they were first published from the pipelines' old repositories.
#   - Tags, on every push to main: `:latest` and `:<short-sha>`. On a pushed `v*` tag: also
#     `:<version>` (`v2.0.0` -> `2.0.0`).
#   - Pull requests: build only, no push.
name: docker image

on:
  workflow_call:
    inputs:
      pipeline:
        description: The package directory under packages/ (also the image name).
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.pipeline }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ inputs.pipeline }}"
          tags="${image}:latest,${image}:${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF#refs/tags/v}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ inputs.pipeline }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
