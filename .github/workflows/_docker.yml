# Build one pipeline's image from the workspace root (it needs fisseq-common and uv.lock) and
# push it, on pushes to main and v* tags only (not on pull requests). Called by
# docker-<pipeline>.yml, whose `paths` filter lists exactly the files that image is built from.
#
#   - Registry: ghcr.io/<owner>/fisseqmono/<pipeline>, the names params.yaml's
#     container_image uses. Namespacing under this repository means the first push creates
#     each package already linked to it, so GITHUB_TOKEN can write to it. (The old
#     ghcr.io/<owner>/<pipeline> packages belong to the pipelines' former repositories.)
#   - Tags, on every push to main: `:latest` and `:<short-sha>`. On a pushed `v*` tag: also
#     `:<version>` (`v2.0.0` -> `2.0.0`).
#   - Layer cache: BuildKit's registry cache at `<image>:buildcache` (mode=max, so every
#     intermediate layer, not just the final image's), read and written by every build, main
#     and tags alike. A runner starts empty, so without it each build redid every layer; with
#     it a source-only change rebuilds only the source layers at the end of the Dockerfile.
#     Registry, not type=gha: the embeddings image is several GB, and GitHub evicts
#     past 10 GB of Actions cache per repository.
name: docker image

on:
  workflow_call:
    inputs:
      pipeline:
        description: The package directory under packages/ (also the image name).
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.pipeline }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ inputs.pipeline }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          tags="${image}:latest,${image}:${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF#refs/tags/v}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ inputs.pipeline }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
