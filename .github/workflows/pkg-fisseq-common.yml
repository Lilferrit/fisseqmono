# fisseq-common's unit tests, on pull requests that change it or what it depends on.
name: fisseq-common

on:
  pull_request:
    paths:
      - packages/fisseq-common/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/_package.yml
      - .github/workflows/pkg-fisseq-common.yml
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/_package.yml
    with:
      package: fisseq-common
      integration: false
