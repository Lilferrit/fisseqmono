# fisseq-common's own test suite, on changes to it or to what it depends on.
name: fisseq-common

on:
  pull_request:
    paths: &paths
      - packages/fisseq-common/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/_package.yml
      - .github/workflows/pkg-fisseq-common.yml
  push:
    branches: [main]
    paths: *paths

jobs:
  tests:
    uses: ./.github/workflows/_package.yml
    with:
      package: fisseq-common
      integration: false
