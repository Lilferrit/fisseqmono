# One documentation site for the fisseqmono workspace: uv run --group docs mkdocs build --strict
site_name: FISSEQ
site_description: fisseq-common, fisseq-data-pipeline, fisseq-embeddings-pipeline and fisseqborn
repo_url: https://github.com/Lilferrit/fisseqmono
repo_name: Lilferrit/fisseqmono
nav:
- Home: index.md
- fisseq-common:
  - Overview: common/index.md
  - Shared stages: common/stages.md
  - Shared Nextflow modules: common/nextflow.md
  - API Reference: common/api.md
- Data pipeline:
  - Home: data-pipeline/index.md
  - Quickstart: data-pipeline/quickstart.md
  - Architecture: data-pipeline/architecture.md
  - Installation: data-pipeline/installation.md
  - Nextflow Workflow: data-pipeline/nextflow.md
  - Configuration: data-pipeline/configuration.md
  - CLI Reference:
    - Input: data-pipeline/cli/input.md
    - Standalone aggregate: data-pipeline/cli/aggregate.md
  - API Reference:
    - input: data-pipeline/api/input.md
    - aggregate: data-pipeline/api/aggregate.md
    - config: data-pipeline/api/config.md
  - Walkthrough: data-pipeline/walkthrough.md
- Embeddings pipeline:
  - Home: embeddings-pipeline/index.md
  - Installation: embeddings-pipeline/installation.md
  - Quickstart: embeddings-pipeline/quickstart.md
  - Architecture: embeddings-pipeline/architecture.md
  - Nextflow Workflow: embeddings-pipeline/nextflow.md
  - Configuration: embeddings-pipeline/configuration.md
  - Stage Reference:
    - 'Cell Images, Phase 1: Enumerate (BUILD_CELL_IMAGES)': embeddings-pipeline/cli/build_cell_images_enumerate.md
    - 'Cell Images, Phase 2: Cell Shards (make_cell_shard, inside BUILD_CELL_IMAGES)': embeddings-pipeline/cli/tile_shard.md
    - 'Cell Images, Phase 3: Build Table (BUILD_CELL_IMAGES)': embeddings-pipeline/cli/build_cell_images_table.md
    - Cell Metadata (BUILD_CELL_METADATA): embeddings-pipeline/cli/cell_metadata.md
    - Cell Embeddings (EMBED_CELLS): embeddings-pipeline/cli/embed.md
    - CellProfiler Feature Dataset (BUILD_CP_FEATURES): embeddings-pipeline/cli/cp_features.md
  - API Reference:
    - build_cell_images_enumerate: embeddings-pipeline/api/build_cell_images_enumerate.md
    - tile_shard: embeddings-pipeline/api/tile_shard.md
    - build_cell_images_table: embeddings-pipeline/api/build_cell_images_table.md
    - cell_metadata: embeddings-pipeline/api/cell_metadata.md
    - embed: embeddings-pipeline/api/embed.md
    - cp_features: embeddings-pipeline/api/cp_features.md
    - config: embeddings-pipeline/api/config.md
    - utils: embeddings-pipeline/api/utils.md
- fisseqborn:
  - Home: fisseqborn/index.md
  - User guide:
    - Concepts: fisseqborn/concepts.md
    - The fisseq theme: fisseqborn/theme.md
    - Loading pipeline outputs: fisseqborn/data.md
  - Plots:
    - Boxplots: fisseqborn/plots/box.md
    - Embeddings (UMAP / PCA): fisseqborn/plots/embedding.md
    - Correlation scatter: fisseqborn/plots/correlation.md
    - ROC curves: fisseqborn/plots/roc.md
    - Heatmaps: fisseqborn/plots/heatmap.md
    - Clustermaps: fisseqborn/plots/clustermap.md
    - Explained variance: fisseqborn/plots/explained-variance.md
    - Pair plots: fisseqborn/plots/pairplot.md
    - Volcano plots: fisseqborn/plots/volcano.md
  - API reference: fisseqborn/api.md
- Diff reports:
  - About: diff-reports/README.md
  - 01 Metadata counts: diff-reports/01-metadata-counts.md
  - 02 Normalize: diff-reports/02-normalize.md
  - 03 Feature selection: diff-reports/03-feature-selection.md
  - 04 fisseqborn global: diff-reports/04-fisseqborn-global.md
  - 05 Row order: diff-reports/05-row-order.md
  - 06 No pycytominer: diff-reports/06-no-pycytominer.md
  - 07 Unify the embeddings pipeline: diff-reports/07-unified-pipelines.md
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
extra_css:
  - data-pipeline/stylesheets/extra.css
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/fisseq-common/src
            - packages/fisseq-data-pipeline/src
            - packages/fisseq-embeddings-pipeline/src
            - packages/fisseqborn/src
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_signature: true
            separate_signature: true
            show_signature_annotations: true
            show_source: true
            heading_level: 3
